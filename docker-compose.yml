version: '3.8'

services:
  resume-forge-ai:
    image: himanshupatil591/resumeforge:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-forge-ai
    ports:
      - "8080:80"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - GROQ_TEMPERATURE=${GROQ_TEMPERATURE:-0.2}
    restart: unless-stopped
